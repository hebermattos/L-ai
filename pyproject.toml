[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.10"
files = ["ingest/contracts.py", "ingest/state.py", "ingest/service.py", "ingest/manifests.py", "ingest/cli.py", "ingest/crawler.py", "ingest/sitemap.py", "ingest/webui.py"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["trafilatura.*", "defusedxml.*"]
ignore_missing_imports = true
