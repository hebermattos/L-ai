name: Validate local AI stack

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: |
          WEBUI_SECRET_KEY=ci-only-test-secret docker compose -f compose.yaml config --quiet
          WEBUI_SECRET_KEY=ci-only-test-secret docker compose -f compose.yaml -f compose.gpu.nvidia.yaml config --quiet
          WEBUI_SECRET_KEY=ci-only-test-secret docker compose -f compose.yaml -f compose.gpu.amd.yaml config --quiet
      - name: Check Bash syntax
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/check.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
      - name: Check Python lint
        run: python3 -m ruff check ingest tests
      - name: Check typed ingestion contracts
        run: python3 -m mypy
      - name: Check project tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q ingest tests

  platform-smoke:
    name: Python CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python ingestion dependencies
        run: python -m pip install -r requirements-ingest.txt
      - name: Validate Python syntax
        run: python -m compileall -q ingest tests
      - name: Validate CLI entry point
        run: python -m ingest.cli --help
